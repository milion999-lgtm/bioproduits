<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - BioProduits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: url('image/bioproduit.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #2f5233;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main.container {
      background: rgba(255, 255, 255, 0.85);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(47, 82, 51, 0.3);
      margin-top: 3rem;
      margin-bottom: 3rem;
      max-width: 600px;
      width: 100%;
    }
    .navbar-nav .nav-link {
      color: #2f5233 !important;
      font-weight: 500;
    }
    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      color: #1b3e1b !important;
    }
    footer {
      background-color: #2f5233;
      color: #d1e7dd;
      padding: 1rem 0;
      text-align: center;
      margin-top: auto;
    }
    button.btn-success:hover {
      background-color: #1b3e1b;
      border-color: #1b3e1b;
    }
    input:focus, textarea:focus {
      border-color: #1b3e1b;
      box-shadow: 0 0 8px #a3cfbb;
      outline: none;
    }
    @media (max-width: 576px) {
      main.container {
        margin: 1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand text-success fw-bold" href="index.html">BioProduits</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="produits.html">Produits</a></li>
        <li class="nav-item"><a class="nav-link" href="panier.html">Panier</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">À propos</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container my-5">
  <h2 class="mb-4 text-center">Contactez-nous</h2>
  <form>
    <div class="mb-3">
      <label for="nom" class="form-label">Nom complet</label>
      <input type="text" class="form-control" id="nom" placeholder="Votre nom complet" required />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Adresse e-mail</label>
      <input type="email" class="form-control" id="email" placeholder="Votre email" required />
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" rows="5" placeholder="Votre message" required></textarea>
    </div>
    <button type="submit" class="btn btn-success w-100">Envoyer</button>
  </form>
</main>

<footer>
  &copy; 2026 BioProduits. Tous droits réservés.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
