<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panier - BioProduits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: url('image/bioproduit.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #2f5233;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: brightness(0.85);
      -webkit-backdrop-filter: brightness(0.85);
    }


    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(231, 245, 230, 0.75);
      z-index: -1;
    }

    .navbar-nav .nav-link {
      color: #2f5233 !important;
      font-weight: 500;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      color: #1b3e1b !important;
    }

    footer {
      background-color: #2f5233;
      color: #d1e7dd;
      padding: 1rem 0;
      text-align: center;
      margin-top: auto;
    }

    main.container {
      flex-grow: 1;
      background: rgba(255, 255, 255, 0.85);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(47, 82, 51, 0.2);
      max-width: 900px;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }

    table {
      background: white;
      box-shadow: 0 4px 10px rgba(47, 82, 51, 0.15);
      border-radius: 10px;
    }

    .table thead {
      background-color: #d4e9d4;
    }

    .empty-message {
      text-align: center;
      padding: 2rem;
      font-style: italic;
      color: #6c757d;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(47, 82, 51, 0.15);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* تحسين تأثير زر الحذف */
    .btn-danger {
      transition: background-color 0.3s ease;
    }

    .btn-danger:hover:enabled {
      background-color: #a71d2a;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand text-success fw-bold" href="index.html">BioProduits</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" href="produits.html">Produits</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">À propos</a></li>
        <li class="nav-item"><a class="nav-link active" href="panier.html">Panier</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container">
  <h2 class="mb-4 text-center">Votre Panier</h2>
  <table class="table table-bordered align-middle">
    <thead>
      <tr>
        <th>Produit</th>
        <th>Quantité</th>
        <th>Prix Unitaire (MAD)</th>
        <th>Total (MAD)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>PAIN Bio</td>
        <td>2</td>
        <td>30.00</td>
        <td>60.00</td>
        <td><button class="btn btn-danger btn-sm" >Supprimer</button></td>
      </tr>
      <tr>
        <td>Huile d'olive Bio</td>
        <td>1</td>
        <td>150.00</td>
        <td>150.00</td>
        <td><button class="btn btn-danger btn-sm" >Supprimer</button></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3" class="text-end">Total Général</th>
        <th>210.00 MAD</th>
        <th></th>
      </tr>
    </tfoot>
  </table>

  <!-- رسالة عند السلة فارغة -->
  <!-- <div class="empty-message">Votre panier est vide.</div> -->

  <div class="text-center mt-4">
    <button class="btn btn-success btn-lg" disabled>Valider la commande (Bientôt disponible)</button>
  </div>
</main>

<footer>
  &copy; 2026 BioProduits. Tous droits réservés.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
